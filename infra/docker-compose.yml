# Flood Rescue Resource Allocation Platform — Docker Compose
# Start with: docker-compose up -d
# Stop with:  docker-compose down
# Reset data: docker-compose down -v
#
# OSRM profile (optional, run with --profile osrm):
# Start OSRM: docker-compose --profile osrm up -d
# Note: PBF download and data prep were not run unless explicitly triggered.

x-osrm-download-common: &osrm-download-common
  image: curlimages/curl:8.10.1
  user: '0:0'
  command:
    - sh
    - -c
    - |
      if [ ! -f /data/region.osm.pbf ]; then
        if [ -z "$${OSRM_PBF_URL}" ]; then
          echo "Error: $${OSRM_PBF_VAR:-OSRM_PBF_URL} is blank or unset. Please configure a verified extract URL before starting $${OSRM_REGION_LABEL:-this region}." >&2
          exit 1
        fi
        echo "Downloading OSM PBF from $${OSRM_PBF_URL}..."
        curl -L -f -o /data/region.osm.pbf "$${OSRM_PBF_URL}"
      else
        echo "OSM PBF already downloaded at /data/region.osm.pbf"
      fi

x-osrm-prep-common: &osrm-prep-common
  image: ghcr.io/project-osrm/osrm-backend:v5.27.1
  command:
    - sh
    - -c
    - |
      if [ ! -f /data/region.osrm.partition ]; then
        echo "Running OSRM extract, partition, and customize on /data/region.osm.pbf..."
        osrm-extract -p /opt/car.lua /data/region.osm.pbf
        osrm-partition /data/region.osrm
        osrm-customize /data/region.osrm
      else
        echo "OSRM prep already completed for /data/region.osrm"
      fi

x-osrm-server-common: &osrm-server-common
  image: ghcr.io/project-osrm/osrm-backend:v5.27.1
  restart: unless-stopped
  command: osrm-routed --algorithm mld --max-table-size 100 /data/region.osrm

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: floodrelay-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-floodrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floodrelay_dev}
      POSTGRES_DB: ${POSTGRES_DB:-floodrelay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-floodrelay} -d ${POSTGRES_DB:-floodrelay}']
      interval: 10s
      timeout: 5s
      retries: 5

  osrm-download:
    image: curlimages/curl:8.10.1
    container_name: floodrelay-osrm-download
    user: '0:0'
    profiles:
      - osrm
    environment:
      OSRM_PBF_URL: ${OSRM_PBF_URL}
    volumes:
      - osrm-data:/data
    command:
      - sh
      - -c
      - |
        if [ ! -f /data/region.osm.pbf ]; then
          if [ -z "$${OSRM_PBF_URL}" ]; then
            echo "Error: OSRM_PBF_URL is not set. Please configure a valid OSM PBF URL in .env." >&2
            exit 1
          fi
          echo "Downloading OSM PBF from $${OSRM_PBF_URL}..."
          curl -L -f -o /data/region.osm.pbf "$${OSRM_PBF_URL}"
        else
          echo "OSM PBF already downloaded at /data/region.osm.pbf"
        fi

  osrm-prep:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: floodrelay-osrm-prep
    profiles:
      - osrm
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - osrm-data:/data
    command:
      - sh
      - -c
      - |
        if [ ! -f /data/region.osrm.partition ]; then
          echo "Running OSRM extract, partition, and customize on /data/region.osm.pbf..."
          osrm-extract -p /opt/car.lua /data/region.osm.pbf
          osrm-partition /data/region.osrm
          osrm-customize /data/region.osrm
        else
          echo "OSRM prep already completed for /data/region.osrm"
        fi

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: floodrelay-osrm
    profiles:
      - osrm
    restart: unless-stopped
    depends_on:
      osrm-prep:
        condition: service_completed_successfully
    ports:
      - '${OSRM_PORT:-5000}:5000'
    volumes:
      - osrm-data:/data
    command: osrm-routed --algorithm mld --max-table-size 100 /data/region.osrm

  # --- Regional India OSRM Profiles (ports 5001-5006) ---
  osrm-download-north:
    <<: *osrm-download-common
    container_name: floodrelay-osrm-download-north
    profiles:
      - osrm-north
    environment:
      OSRM_PBF_VAR: OSRM_PBF_URL_NORTH
      OSRM_REGION_LABEL: osrm-north
      OSRM_PBF_URL: ${OSRM_PBF_URL_NORTH:-}
    volumes:
      - osrm-data-north:/data

  osrm-prep-north:
    <<: *osrm-prep-common
    container_name: floodrelay-osrm-prep-north
    profiles:
      - osrm-north
    depends_on:
      osrm-download-north:
        condition: service_completed_successfully
    volumes:
      - osrm-data-north:/data

  osrm-north:
    <<: *osrm-server-common
    container_name: floodrelay-osrm-north
    profiles:
      - osrm-north
    depends_on:
      osrm-prep-north:
        condition: service_completed_successfully
    ports:
      - '${OSRM_PORT_NORTH:-5001}:5000'
    volumes:
      - osrm-data-north:/data

  osrm-download-south:
    <<: *osrm-download-common
    container_name: floodrelay-osrm-download-south
    profiles:
      - osrm-south
    environment:
      OSRM_PBF_VAR: OSRM_PBF_URL_SOUTH
      OSRM_REGION_LABEL: osrm-south
      OSRM_PBF_URL: ${OSRM_PBF_URL_SOUTH:-}
    volumes:
      - osrm-data-south:/data

  osrm-prep-south:
