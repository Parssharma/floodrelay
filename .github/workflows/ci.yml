name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: floodrelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/floodrelay_test
      REQUIRE_DB: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'tools/ortools-baseline/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/ortools-baseline/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Security audit
        run: npm audit --audit-level=critical

      - name: Secrets hygiene check
        run: |
          # Verify no committed credentials or unencrypted secret tokens in tracked files
          ! git grep -i -E "(ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9]{82}|BEGIN PRIVATE KEY)" -- ':(exclude).env.example' ':(exclude)*.test.ts' ':(exclude).github/**'

      - name: Python pytest
        run: pytest tools/ortools-baseline/tests

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run migrations up
        run: npm --workspace=@floodrelay/api run migrate

      - name: Test migrations down (rollback)
        run: npm --workspace=@floodrelay/api run migrate:down

      - name: Re-apply migrations up for integration tests
        run: npm --workspace=@floodrelay/api run migrate

      - name: Test
        run: npm test

      - name: Format check
        run: npm run format:check

      - name: Build backend API
        run: npm run build --workspace=@floodrelay/api

      - name: Build frontend web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          GEOAPIFY_API_KEY: 'ci_placeholder_key'
        run: npm run build --workspace=@floodrelay/web

      - name: Generate disposable CI operator credentials
        run: |
          CI_PASSWORD=$(node -e "console.log(require('crypto').randomBytes(24).toString('hex'))")
          echo "::add-mask::$CI_PASSWORD"
          echo "CI_OPERATOR_PASSWORD=$CI_PASSWORD" >> "$GITHUB_ENV"

      - name: Load testing smoke verification
        env:
          PORT: '3001'
          DATABASE_URL: 'postgres://postgres:postgrespassword@localhost:5432/floodrelay_test'
          API_BASE_URL: 'http://localhost:3001'
          LOAD_PROFILE: 'smoke'
          LOAD_TEST_USERNAME: 'ci_operator'
          LOAD_TEST_PASSWORD: ${{ env.CI_OPERATOR_PASSWORD }}
          INITIAL_OPERATOR_USERNAME: 'ci_operator'
          INITIAL_OPERATOR_PASSWORD: ${{ env.CI_OPERATOR_PASSWORD }}
        run: |
          npm --workspace=@floodrelay/api run start &
          for i in {1..30}; do
            if curl -s http://localhost:3001/health > /dev/null; then
              echo "API server ready on port 3001"
              break
            fi
            sleep 1
          done
          # Verify unauthenticated smoke profile works without credentials
          k6 run -e LOAD_PROFILE=smoke -e TEST_DURATION=15s -e API_BASE_URL=http://localhost:3001 tests/load/index.js
          # Verify authenticated load execution with dynamically generated masked disposable credentials
          k6 run -e LOAD_PROFILE=smoke -e TEST_DURATION=15s -e API_BASE_URL=http://localhost:3001 -e LOAD_TEST_USERNAME=ci_operator -e "LOAD_TEST_PASSWORD=$LOAD_TEST_PASSWORD" tests/load/index.js
